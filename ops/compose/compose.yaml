name: gitea-stack

services:
  gitea:
    image: ${GITEA_IMAGE}:${GITEA_VERSION}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.aliyun.com/alpine}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        GITEA_VERSION: ${GITEA_VERSION}
        GITEA_UPSTREAM_COMMIT: ${GITEA_UPSTREAM_COMMIT}
        GITEA_INTERNAL_COMMIT: ${GITEA_INTERNAL_COMMIT}
        GITEA_BUILD_DATE: ${GITEA_BUILD_DATE}
        GOPROXY: ${GOPROXY:-https://goproxy.cn,direct}
    restart: unless-stopped
    environment:
      USER_UID: "1000"
      USER_GID: "1000"
      GITEA__database__DB_TYPE: sqlite3
      GITEA__database__PATH: /data/gitea/gitea.db
      GITEA__org_project__ENABLED: "true"
      GITEA__security__INSTALL_LOCK: "true"
      GITEA__server__DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__ROOT_URL: https://${GITEA_DOMAIN}/
      GITEA__server__PROTOCOL: http
      GITEA__server__HTTP_PORT: "3000"
      GITEA__server__SSH_DOMAIN: ${GITEA_DOMAIN}
      GITEA__server__SSH_PORT: "2222"
      GITEA__server__OFFLINE_MODE: "true"
      GITEA__server__LANDING_PAGE: login
      GITEA__service__DISABLE_REGISTRATION: "true"
      GITEA__service__SHOW_REGISTRATION_BUTTON: "false"
      GITEA__service__REQUIRE_SIGNIN_VIEW: "true"
      GITEA__service__DEFAULT_ALLOW_CREATE_ORGANIZATION: "false"
      GITEA__service__DEFAULT_USER_VISIBILITY: private
      GITEA__service__DEFAULT_ORG_VISIBILITY: private
      GITEA__repository__DEFAULT_PRIVATE: private
      GITEA__repository__DEFAULT_BRANCH: main
      GITEA__repository__USER_MAX_CREATION_LIMIT: "0"
      GITEA__repository__ORG_MAX_CREATION_LIMIT: "-1"
      GITEA__repository__DISABLE_MIGRATIONS: "true"
      GITEA__repository__DISABLED_REPO_UNITS: repo.issues,repo.ext_issues,repo.wiki,repo.ext_wiki,repo.projects,repo.packages,repo.actions
      GITEA__repository__DEFAULT_REPO_UNITS: repo.code,repo.releases,repo.pulls
      GITEA__actions__ENABLED: "false"
      GITEA__packages__ENABLED: "false"
      GITEA__mirror__ENABLED: "false"
      GITEA__federation__ENABLED: "false"
      GITEA__openid__ENABLE_OPENID_SIGNIN: "false"
      GITEA__openid__ENABLE_OPENID_SIGNUP: "false"
      GITEA__session__COOKIE_SECURE: "true"
      GITEA__log__MODE: console
      GITEA__log__LEVEL: Info
    volumes:
      - ${GITEA_DATA_DIR}:/data
    ports:
      - "127.0.0.1:3000:3000"
      - "2222:22"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget --spider --quiet http://127.0.0.1:3000/api/healthz || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 60s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

networks:
  internal:
    driver: bridge
